[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["E501", "PLR2004", "PLR0913"]

[tool.ruff.lint.isort]
# Same import layout as Home Assistant core.
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.golemio_waste"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
split-on-trailing-comma = false
